# Quarto Document Configuration
# This YAML file defines the structure and components of the main document

document:
  title: "2005 Honda CRV Oil Change Documentation"
  author: "Lucas Burlingham"
  date: "2026-11-04"
  
components:
  - file: "templates/01-cover-sheet.qmd"
    title: "Cover Sheet"
    type: "cover"

  - file: "templates/02-toc.qmd"
    title: "Table of Contents"
    type: "toc"

  - file: "templates/03-signature-document.qmd"
    title: "Approved Signature Document"
    type: "signature"

  - file: "templates/04-oil-change-guide.qmd"
    title: "How to Change Oil on a 2005 Honda CRV"
    type: "main_content"

  - file: "templates/appendix-a.qmd"
    title: "Appendix A: Parts and Tools Checklist"
    type: "appendix"

  - file: "templates/appendix-b.qmd"
    title: "Appendix B: Maintenance Schedule"
    type: "appendix"

  - file: "documents/index.qmd"
    title: "Master Document"
    type: "master"

output:
  format: "html"
  toc: true
  toc-depth: 2
  number-sections: true
  code-fold: false
  self-contained: true
